[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picasso-landmesh"
version = "0.1.0"
description = "Picasso LandMesh (PLM) - terrain modelling engine (TIN, contours, alignments, sections)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "triangle>=20230923",
    "ezdxf>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
plm = "plm.cli:main"

[tool.setuptools.packages.find]
include = ["plm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
