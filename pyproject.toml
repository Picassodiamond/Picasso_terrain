[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picasso-landmesh"
version = "0.2.0"
description = "Picasso LandMesh (PLM) - terrain modelling engine (TIN, contours, alignments, sections)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "triangle>=20230923",
    "ezdxf>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "httpx"]  # httpx is what starlette's TestClient runs on
# everything the web server needs on top of the geometry engine. On cPanel (Passenger is WSGI-only)
# a2wsgi wraps the ASGI application; uvicorn is only for running it locally.
server = ["fastapi>=0.115", "python-multipart>=0.0.9", "a2wsgi>=1.10"]
local = ["uvicorn[standard]>=0.30"]

[project.scripts]
plm = "plm.cli:main"

[tool.setuptools.packages.find]
include = ["plm*"]

[tool.setuptools.package-data]
plm = ["design/standards/*.json", "design/sheets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
